  .links{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:4px}
  a.link{display:flex;justify-content:space-between;align-items:center;background:var(--surf2);border-radius:12px;

  a.link span.arrow{color:var(--gold-deep)}
  .tag{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.5}
